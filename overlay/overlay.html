<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlay Luxanita</title>
<link rel="icon" href="data:,">
<!--
  OVERLAY SUBMARINO PARA OBS (1920x1080) — inspirado en Nami (olas, escamas, burbujas)
  - En OBS: fuente "Navegador", archivo local = este overlay.html, 1920 x 1080.
  - Los huecos del juego y de la cámara son transparentes.
  - Para verlo con contenido de ejemplo, abre: overlay.html?demo
  - Posiciones y tamaños de los huecos: en LAYOUT (más abajo) y en INSTRUCCIONES.txt
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');

/* Tipografía del logotipo «Luxanita» (la misma que la web luxanita.aleixaj.com).
   Versión demo: solo letras, y licencia de uso personal (ver fuentes/LEEME.txt). */
@font-face {
  font-family: 'Dream American Diner';
  src: url('fuentes/Dream-American-Diner-demo.ttf.woff') format('woff');
  font-display: block;
}

:root {
  --pink: #ff5fa8;
  --pink-soft: #ffc2dd;
  --pink-deep: #e2317f;
  --coral: #ff7f9e;
  --aqua: #7ff3e6;          /* toque de Nami */
  --pearl: #fff6fb;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

/* escenario fijo de 1920x1080 que se escala a la ventana */
#stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  font-family: 'Fredoka', 'Nunito', 'Segoe UI Rounded', 'Arial Rounded MT Bold', 'Segoe UI', system-ui, sans-serif;
}

/* ===== Fondo marino (todo menos los huecos; la forma la pone el JS) ===== */
.sea {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse 45% 22% at 50% 0%, rgba(255,214,236,.75), rgba(255,160,205,0) 75%),
    radial-gradient(ellipse 35% 45% at 0% 100%, rgba(255,95,168,.35), transparent 70%),
    radial-gradient(ellipse 35% 45% at 100% 100%, rgba(200,120,255,.3), transparent 70%),
    linear-gradient(180deg, #e97bbd 0%, #b2479b 25%, #85308f 55%, #62237a 85%, #56206f 100%);
}

/* rayos de luz desde la superficie */
.rays {
  position: absolute;
  inset: -10% -10% 0;
  background: repeating-linear-gradient(100deg,
    rgba(255,230,245,0) 0 70px, rgba(255,230,245,.16) 90px, rgba(255,230,245,0) 140px,
    rgba(255,230,245,0) 230px, rgba(255,230,245,.1) 250px, rgba(255,230,245,0) 300px);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.5) 45%, transparent 85%);
          mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.5) 45%, transparent 85%);
  animation: rays 26s ease-in-out infinite alternate;
}
@keyframes rays {
  from { transform: translateX(-60px) skewX(-4deg); opacity: .8; }
  to   { transform: translateX(60px) skewX(4deg); opacity: 1; }
}

/* reflejos de agua (cáusticas) que se mueven arriba */
.caustics {
  position: absolute;
  left: 0;
  top: 0;
  width: 2880px;             /* 3 veces el dibujo de 960 px: se desplaza 960 px y vuelve a empezar */
  height: 260px;
  will-change: transform;
  background:
    radial-gradient(ellipse 60px 18px at 10% 30%, rgba(255,255,255,.18), transparent 70%),
    radial-gradient(ellipse 80px 22px at 28% 55%, rgba(255,255,255,.14), transparent 70%),
    radial-gradient(ellipse 70px 20px at 47% 20%, rgba(255,255,255,.16), transparent 70%),
    radial-gradient(ellipse 90px 24px at 68% 45%, rgba(255,255,255,.14), transparent 70%),
    radial-gradient(ellipse 60px 18px at 86% 25%, rgba(255,255,255,.18), transparent 70%);
  background-size: 960px 260px;
  animation: caustics 22s linear infinite;
  opacity: .9;
}
@keyframes caustics { to { transform: translateX(-960px); } }

/* burbujas: la de fuera sube en línea recta y la de dentro se mece suave
   (dos movimientos separados = sin tirones al cambiar de dirección) */
.bubbles span {
  position: absolute;
  bottom: -60px;
  left: var(--x);
  width: var(--s);
  height: var(--s);
  will-change: transform;
  animation: rise var(--d) linear var(--t) infinite;
}
.bubbles span i {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.14) 12%, rgba(255,214,236,.1) 60%, rgba(255,214,236,.55) 100%);
}
@keyframes rise {
  0%   { transform: translateY(0); opacity: 0; }
  8%   { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translateY(-1160px); opacity: 0; }
}

/* luces difuminadas que flotan (bokeh) */
.bokeh span {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  border-radius: 50%;
  background: radial-gradient(circle, var(--c) 0%, rgba(255,255,255,0) 70%);
}

/* ===== Marcos color perla ===== */
.frame {
  position: absolute;
  box-sizing: border-box;
  border: 7px solid var(--pearl);
  border-radius: 35px;
  box-shadow:
    0 0 0 3px rgba(255,95,168,.55),
    0 8px 0 3px rgba(226,49,127,.45),
    0 18px 44px rgba(60,10,70,.5);
}
/* luz de neón rosa que recorre el borde (la dibuja el JS: una estela que se va afinando) */
.frame .neon {
  position: absolute;
  left: -7px;
  top: -7px;
  overflow: visible;
  pointer-events: none;
}
.frame .neon rect { fill: none; stroke-linecap: round; }

/* ola que se riza sobre el marco del juego */
.wave {
  position: absolute;
  left: 40px;
  top: -44px;                /* asentada sobre el borde, sin entrar en el hueco */
  width: 300px;
  height: 40px;
  filter: drop-shadow(0 3px 0 rgba(226,49,127,.45));
}
.wave.r { left: auto; right: 40px; transform: scaleX(-1); }
.wave svg { display: block; width: 100%; height: 100%; overflow: visible; }
.wave .foam { animation: foam 3s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes foam { from { transform: translateY(1px) scaleY(.94); } to { transform: translateY(-1px) scaleY(1.04); } }

/* etiqueta del marco */
.tag {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 22px 7px;
  border-radius: 999px;
  background: linear-gradient(180deg, #ff86c0 0%, var(--pink) 55%, #f24c98 100%);
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .04em;
  white-space: nowrap;
  text-shadow: 0 2px 0 rgba(180,20,90,.35);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 4px 0 var(--pink-deep), 0 0 18px rgba(255,95,168,.45);
  z-index: 2;
}
.tag svg { width: .9em; height: .9em; vertical-align: -.1em; margin-right: 6px; }


/* ===== Título ===== */
.title {
  position: absolute;
  left: 50%;
  top: 48px;
  transform: translateX(-50%);
  animation: float 6s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-5px); }
}
.title-card {
  position: relative;
  padding: 8px 60px 4px;
  border-radius: 999px;
  background:
    radial-gradient(circle at 50% 120%, rgba(127,243,230,.25), transparent 60%),
    linear-gradient(180deg, #fff 0%, #fff0f7 55%, #ffd6ea 100%);
  border: 5px solid var(--pearl);
  box-shadow:
    0 0 0 3px rgba(255,95,168,.55),
    0 8px 0 3px rgba(226,49,127,.45),
    inset 0 0 22px rgba(255,194,221,.8);      /* sin sombra difusa: el título queda encima del juego y no debe oscurecerlo */
}
/* escamas y brillo van recortados a la forma del cartel; el nombre puede sobresalir */
.title-card .clip {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
}
/* escamas de sirena muy suaves */
.title-card .scales {
  position: absolute;
  inset: 0;
  opacity: .35;
  background:
    radial-gradient(circle at 50% 0, transparent 13px, rgba(255,140,196,.55) 14px, transparent 16px) 0 0 / 30px 18px,
    radial-gradient(circle at 50% 0, transparent 13px, rgba(255,140,196,.55) 14px, transparent 16px) 15px 9px / 30px 18px;
}
.title-card .shine {
  position: absolute;
  top: -30%;
  bottom: -30%;
  left: 0;
  width: 100%;
  background: linear-gradient(90deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 60%);
  transform: translateX(-120%) skewX(-20deg);
  animation: shine 7s ease-in-out 2s infinite;
}
@keyframes shine {
  0%        { transform: translateX(-120%) skewX(-20deg); }
  14%, 100% { transform: translateX(120%) skewX(-20deg); }
}
.name {
  position: relative;
  font-family: 'Dream American Diner', 'Fredoka', cursive;
  font-size: 86px;
  font-weight: normal;
  line-height: .78;      /* las letras sobresalen un poco por arriba del cartel */
  letter-spacing: 0;
  /* caja más grande que las letras (el degradado solo se pinta dentro de la caja),
     con márgenes negativos para que el cartel no crezca */
  padding: 40px 24px 26px;
  margin: -40px -24px -26px;
  background: linear-gradient(180deg, #ff8cc4 0%, #ff4f9f 45%, #d42475 100%);
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  filter:
    drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
    drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
    drop-shadow(0 5px 0 var(--pink-soft));
}
/* copos de nieve a los lados del título */
.title .flake {
  position: absolute;
  top: 50%;
  width: 60px;
  height: 60px;
  margin-top: -30px;
  color: #fff;
  filter: drop-shadow(0 0 6px rgba(255,194,221,.95)) drop-shadow(0 0 12px rgba(127,243,230,.5));
  animation: twirl 14s linear infinite;
}
.title .flake.l { left: -84px; }
.title .flake.r { right: -84px; animation-direction: reverse; }
@keyframes twirl { to { transform: rotate(360deg); } }
.title svg { display: block; width: 100%; height: 100%; }

/* perlitas */
.pearl {
  position: absolute;
  width: var(--s, 12px);
  height: var(--s, 12px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 20%, #ffe3f1 45%, #f5b3d4 100%);
  box-shadow: 0 0 8px rgba(255,255,255,.6);
  animation: glint var(--d, 3s) ease-in-out var(--t, 0s) infinite;
}
@keyframes glint {
  0%, 100% { opacity: .55; transform: scale(.85); }
  50%      { opacity: 1;   transform: scale(1.1); }
}

/* ===== Ojo de buey: ventanita redonda con una escena submarina ===== */
.porthole {
  position: absolute;
  left: 1546px;              /* centro en x=1696, y=304 (lo recoloca el JS según la cámara) */
  top: 154px;
  width: 300px;
  height: 300px;
}
/* aro perlado */
.porthole .ring {
  position: absolute;
  inset: -18px;
  border-radius: 50%;
  background: conic-gradient(from 200deg, #fff, #ffd3e8, #ff9ccb, #fff, #c8fff8, #ffd3e8, #fff);
  box-shadow:
    0 0 0 3px rgba(255,95,168,.6),
    0 8px 0 3px rgba(226,49,127,.45),
    0 12px 24px rgba(60,10,70,.4),
    inset 0 0 0 3px rgba(255,255,255,.7),
    inset 0 0 14px rgba(226,49,127,.45);
}
/* remaches de perla en el aro */
.porthole .rivet {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 22%, #ffe3f1 50%, #f29cc7 100%);
  box-shadow: 0 1px 2px rgba(120,20,80,.45);
}
/* el agua de dentro */
.porthole .water {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  background:
    radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,220,240,.65), transparent 70%),
    linear-gradient(180deg, #f08cc6 0%, #c552a8 40%, #8a2f92 75%, #5a1f73 100%);
  box-shadow: inset 0 0 30px rgba(40,5,50,.55);
}
.porthole .water .rays {
  inset: -20% -30% 0;
  animation-duration: 18s;
}
/* animales que pasan por la ventana (los crea el JS al azar) */
.porthole .swimmer {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}
.porthole .swimmer .flip { width: 100%; height: 100%; }
.porthole .swimmer.left .flip { transform: scaleX(-1); }
.porthole .swimmer svg, .porthole .swimmer img { display: block; width: 100%; height: 100%; overflow: visible; }
.porthole .swimmer img { object-fit: contain; filter: drop-shadow(0 6px 10px rgba(60,10,70,.35)); }
.porthole .swimmer .body { width: 100%; height: 100%; animation: bob 2.2s ease-in-out infinite alternate; }
.porthole .swimmer.fast .body { animation-duration: 1.3s; }
.porthole .swimmer.pulse .body { animation: squish 2.6s ease-in-out infinite; transform-origin: 50% 30%; }
@keyframes bob    { from { transform: translateY(-3px) rotate(-2deg); } to { transform: translateY(3px) rotate(2deg); } }
@keyframes squish { 0%, 100% { transform: scale(1, 1); } 45% { transform: scale(.88, 1.1); } }
/* burbujitas que sueltan al nadar */
.porthole .trail {
  position: absolute;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 12%, rgba(255,255,255,.15) 16%, rgba(255,214,236,.6) 100%);
}
.porthole .pbub span {
  position: absolute;
  bottom: -20px;
  left: var(--x);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,.15) 14%, rgba(255,214,236,.55) 100%);
}
/* brillo del cristal */
.porthole .glass {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(ellipse 34% 20% at 32% 22%, rgba(255,255,255,.55), transparent 70%),
    radial-gradient(circle at 50% 50%, transparent 62%, rgba(255,255,255,.18) 70%, transparent 74%);
  pointer-events: none;
}

/* ===== Abierto fuera de OBS: fondo oscuro alrededor y cuadritos en los huecos ===== */
html.preview body { background: #1b0e2c; }
.transp {
  position: absolute;
  border-radius: 28px;
  background: repeating-conic-gradient(#d9d3e3 0 25%, #f4f1f8 0 50%) 0 0 / 32px 32px;
}
.transp::after {
  content: 'transparente en OBS';
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(27,14,44,.7);
  color: #fff;
  font: 600 22px/1 'Fredoka', sans-serif;
  white-space: nowrap;
}

/* ===== Modo demo (overlay.html?demo): contenido de ejemplo en los huecos ===== */
.demo { position: absolute; overflow: hidden; border-radius: 28px; }
.demo.game {
  background:
    radial-gradient(ellipse 30% 20% at 70% 30%, rgba(255,255,200,.6), transparent 70%),
    linear-gradient(180deg, #7ec8ff 0%, #b9e3ff 45%, #6fcf6a 46%, #3f9a45 100%);
}
.demo.game::after, .demo.cam::after {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 700 64px/1 'Fredoka', sans-serif;
  color: rgba(255,255,255,.75);
  letter-spacing: .2em;
}
.demo.game::after { content: 'JUEGO'; }
.demo.cam { background: linear-gradient(135deg, #5b3a6e, #2e2240); }
.demo.cam::after { content: 'CÁMARA'; font-size: 34px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<div id="stage">
  <div class="sea">
    <div class="rays"></div>
    <div class="caustics"></div>
    <div class="bokeh"></div>
    <div class="bubbles"></div>
  </div>
  <div id="demo-layer"></div>
  <div id="deco" style="position:absolute;inset:0">
  <div class="porthole">
    <div class="ring"></div>
    <div class="water">
      <div class="rays"></div>
      <div class="bokeh pbokeh"></div>
      <div class="swimmers"></div>
      <div class="pbub"></div>
    </div>
    <div class="glass"></div>
  </div>
  <div id="frames"></div>
  </div>
  <!-- el título va fuera del recorte: puede quedar por encima del marco del juego -->
  <div class="title">
    <div class="title-card">
      <div class="clip"><div class="scales"></div><div class="shine"></div></div>
      <div class="name">Luxanita</div>
    </div>
    <svg class="flake l"><use href="#flake"/></svg>
    <svg class="flake r"><use href="#flake"/></svg>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="wave-g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#d9fffa"/><stop offset="1" stop-color="#7ff3e6"/>
  </linearGradient>
  <!-- copo de nieve -->
  <symbol id="flake" viewBox="-52 -52 104 104">
    <g stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none">
      <g><path d="M0 0V-44M0-24L-12-35M0-24L12-35M0-37L-7-45M0-37L7-45"/></g>
      <g transform="rotate(60)"><path d="M0 0V-44M0-24L-12-35M0-24L12-35M0-37L-7-45M0-37L7-45"/></g>
      <g transform="rotate(120)"><path d="M0 0V-44M0-24L-12-35M0-24L12-35M0-37L-7-45M0-37L7-45"/></g>
      <g transform="rotate(180)"><path d="M0 0V-44M0-24L-12-35M0-24L12-35M0-37L-7-45M0-37L7-45"/></g>
      <g transform="rotate(240)"><path d="M0 0V-44M0-24L-12-35M0-24L12-35M0-37L-7-45M0-37L7-45"/></g>
      <g transform="rotate(300)"><path d="M0 0V-44M0-24L-12-35M0-24L12-35M0-37L-7-45M0-37L7-45"/></g>
    </g>
    <circle r="8" fill="currentColor"/>
  </symbol>
  <symbol id="bubble-ico" viewBox="0 0 16 16">
    <circle cx="6" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12.5" cy="4" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </symbol>
</defs></svg>

<script>
(function () {
  // ===== Huecos (en píxeles de una pantalla 1920x1080) =====
  // Si los cambias, cambia también las posiciones en OBS (INSTRUCCIONES.txt).
  var LAYOUT = {
    game: { x: 32,   y: 182, w: 1392, h: 783 },   // 16:9 (el cliente del LoL, 1280x720, cabe sin perder nitidez)
    cam:  { x: 1448, y: 485, w: 440,  h: 480 }    // un poco más alta que ancha, alineada abajo con el juego
  };
  var R = 28;          // redondeo de las esquinas de los huecos
  var BORDER = 7;      // grosor del marco

  var stage = document.getElementById('stage');
  var frames = document.getElementById('frames');
  var demo = /[?&]demo\b/.test(location.search);

  // escala el escenario de 1920x1080 a la ventana (por si la fuente de OBS tiene otro tamaño)
  // En OBS (existe window.obsstudio) los huecos son transparentes de verdad.
  // Abierto en un navegador normal se marcan con cuadritos para que se vea que son transparentes.
  var enOBS = !!window.obsstudio;
  if (!enOBS) document.documentElement.classList.add('preview');

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    // centrado: si la ventana no es 16:9, lo que sobra queda repartido a los lados
    var x = (window.innerWidth - 1920 * s) / 2, y = (window.innerHeight - 1080 * s) / 2;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  // números aleatorios repetibles (siempre sale igual)
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry(11);

  // ----- fondo con agujeros: rectángulo completo + un rectángulo redondeado por hueco -----
  function rr(b) {
    var x = b.x, y = b.y, w = b.w, h = b.h, r = R;
    return 'M' + (x + r) + ' ' + y + 'H' + (x + w - r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + w) + ' ' + (y + r) +
           'V' + (y + h - r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + w - r) + ' ' + (y + h) +
           'H' + (x + r) + 'A' + r + ' ' + r + ' 0 0 1 ' + x + ' ' + (y + h - r) +
           'V' + (y + r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + r) + ' ' + y + 'Z';
  }
  var path = 'M0 0H1920V1080H0Z' + rr(LAYOUT.game) + rr(LAYOUT.cam);
  // el fondo y toda la decoración se recortan con la misma forma: nada pinta dentro de los huecos
  document.querySelector('.sea').style.clipPath = "path(evenodd, '" + path + "')";
  document.getElementById('deco').style.clipPath = "path(evenodd, '" + path + "')";

  // ----- ola que se riza (para encima del marco del juego) -----
  var WAVE = '<svg viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true"><g class="foam">' +
    '<path d="M0 40 C30 40 40 26 62 22 C80 19 92 28 88 34 C85 38 78 36 79 31 C70 33 72 40 84 40Z" fill="url(#wave-g)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="M70 40 C110 38 120 12 152 8 C178 5 196 20 190 31 C186 38 174 36 176 28 C162 30 164 40 180 40Z" fill="url(#wave-g)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="M170 40 C200 40 212 24 234 20 C252 17 264 27 260 33 C257 38 250 36 251 31 C242 33 244 40 256 40 L300 40Z" fill="url(#wave-g)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="120" cy="6" r="3" fill="#fff"/><circle cx="210" cy="12" r="2.4" fill="#fff"/><circle cx="40" cy="16" r="2" fill="#fff"/>' +
    '</g></svg>';

  // ----- marcos -----
  function place(el, b, grow) {
    el.style.left = (b.x - grow) + 'px';
    el.style.top = (b.y - grow) + 'px';
    el.style.width = (b.w + grow * 2) + 'px';
    el.style.height = (b.h + grow * 2) + 'px';
  }
  function frame(key, b, opts) {
    if (demo || !enOBS) {
      var d = document.createElement('div');
      d.className = demo ? 'demo ' + key : 'transp';
      place(d, b, 0);
      document.getElementById('demo-layer').appendChild(d);
    }
    var f = document.createElement('div');
    f.className = 'frame';
    place(f, b, BORDER);
    f.innerHTML = neonSVG(b) +
      (opts.waves ? '<div class="wave">' + WAVE + '</div><div class="wave r">' + WAVE + '</div>' : '') +
      (opts.tag ? '<div class="tag">' + opts.tag + '</div>' : '');
    frames.appendChild(f);
    animarNeon(f, b);
  }

  // ----- neón: varias capas que comparten la cabeza; cuanto más larga, más fina y transparente -----
  var NEON_CAPAS = 9, NEON_COLA = 0.55, NEON_VEL = 170;     // capas, largo de la estela (parte del borde), px por segundo
  function neonSVG(b) {
    var W = b.w + BORDER * 2, H = b.h + BORDER * 2, h = BORDER / 2, r = R + BORDER - h;
    var rect = '<rect x="' + h + '" y="' + h + '" width="' + (W - BORDER) + '" height="' + (H - BORDER) + '" rx="' + r + '" pathLength="1000"';
    // halo ancho y suave a lo largo de toda la estela
    var out = '<svg class="neon" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
              rect + ' data-halo="1" stroke="#ff6ec7" stroke-width="34" stroke-opacity=".14"/>' +
              rect + ' data-halo="1" stroke="#ff8ad8" stroke-width="20" stroke-opacity=".3"/>';
    for (var k = 0; k < NEON_CAPAS; k++) {
      var t = k / (NEON_CAPAS - 1);                                   // 0 = cabeza, 1 = final de la cola
      var ancho = (12 - t * 8.5).toFixed(2);                          // de 12 px a 3,5 px
      var op = (1 - t * .6).toFixed(2);
      var color = k === 0 ? '#fff0fa' : (k < 3 ? '#ffa3e0' : '#ff6ec7');      // rosa chicle neón
      out += rect + ' stroke="' + color + '" stroke-width="' + ancho + '" stroke-opacity="' + op + '"/>';
    }
    return out + '</svg>';
  }
  function animarNeon(f, b) {
    var per = 2 * (b.w + b.h + BORDER * 2) - (8 - 2 * Math.PI) * (R + BORDER / 2);   // perímetro aprox.
    var dur = per / NEON_VEL * 1000;
    var rects = f.querySelectorAll('.neon rect');
    var capa = 0;
    rects.forEach(function (rc) {
      var largo = rc.dataset.halo ? 1000 * NEON_COLA : 1000 * NEON_COLA * Math.pow(++capa / NEON_CAPAS, 1.4) + 6;   // la cabeza es la capa más corta
      rc.setAttribute('stroke-dasharray', largo.toFixed(1) + ' ' + (1000 - largo).toFixed(1));
      rc.animate([{ strokeDashoffset: largo }, { strokeDashoffset: largo - 1000 }],
                 { duration: dur, iterations: Infinity, easing: 'linear' });
    });
  }

  frame('game', LAYOUT.game, { waves: true });
  frame('cam',  LAYOUT.cam,  {});

  // ----- luces difuminadas (rosas, blancas y algún toque aguamarina) -----
  var bokeh = document.querySelector('.bokeh'), html = '';
  var tints = ['rgba(255,190,225,.75)', 'rgba(255,255,255,.6)', 'rgba(255,130,200,.7)', 'rgba(127,243,230,.5)', 'rgba(225,180,255,.65)'];
  for (var i = 0; i < 20; i++) {
    html += '<span style="--x:' + (rnd() * 100).toFixed(1) + '%;--y:' + (rnd() * 100).toFixed(1) + '%;--s:' + (60 + rnd() * 160 | 0) + 'px;--c:' + tints[i % tints.length] + '"></span>';
  }
  bokeh.innerHTML = html;
  // luces: se desplazan y "respiran" despacio (solo transform y opacidad: lo hace la tarjeta gráfica)
  function luces(cont, mov, dmin, dvar) {
    cont.querySelectorAll('span').forEach(function (el) {
      var d = (dmin + rnd() * dvar) * 1000, dx = (rnd() - .5) * mov, dy = (rnd() - .5) * mov * .75;
      el.animate([{ transform: 'translate(0,0)', opacity: .45 }, { transform: 'translate(' + dx + 'px,' + dy + 'px)', opacity: 1 }],
                 { duration: d, delay: -rnd() * d, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
    });
  }
  luces(bokeh, 160, 18, 16);

  // ----- burbujas -----
  var bubbles = document.querySelector('.bubbles'); html = '';
  for (i = 0; i < 45; i++) {
    html += '<span style="--x:' + (rnd() * 100).toFixed(1) + '%;--s:' + (6 + Math.pow(rnd(), 2) * 44 | 0) + 'px;--d:' + (20 + rnd() * 16).toFixed(1) + 's;--t:' + (-rnd() * 36).toFixed(1) + 's"><i></i></span>';
  }
  bubbles.innerHTML = html;
  // balanceo de cada burbuja, aparte de la subida (así no hay tirones)
  bubbles.querySelectorAll('i').forEach(function (el) {
    var w = 6 + rnd() * 16, d = (2.5 + rnd() * 2.5) * 1000;
    el.animate([{ transform: 'translateX(' + (-w) + 'px)' }, { transform: 'translateX(' + w + 'px)' }],
               { duration: d, delay: -rnd() * d, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
  });

  // ----- ojo de buey: centrado en el hueco que queda encima de la cámara -----
  var ph = document.querySelector('.porthole');
  // la ventana va por debajo de los marcos: si su sombra llega a la cámara, queda tapada por el marco
  var top = LAYOUT.game.y;
  var D = Math.min(330, LAYOUT.cam.y - BORDER - top - 18 - 6, LAYOUT.cam.w - 40);
  ph.style.width = ph.style.height = D + 'px';
  ph.style.left = (LAYOUT.cam.x + LAYOUT.cam.w / 2 - D / 2) + 'px';
  ph.style.top = top + 'px';
  var ring = ph.querySelector('.ring');
  for (i = 0; i < 12; i++) {
    var a = i / 12 * Math.PI * 2, rv = document.createElement('div');
    rv.className = 'rivet';
    rv.style.left = (D / 2 + 18 + Math.cos(a) * (D / 2 + 9)) + 'px';
    rv.style.top = (D / 2 + 18 + Math.sin(a) * (D / 2 + 9)) + 'px';
    ring.appendChild(rv);
  }
  // ----- animales que pasan por la ventana, al azar (como mucho 2 a la vez) -----
  // Dibujos: Fluent Emoji de Microsoft (licencia MIT, ver animales/LICENCIA.txt).
  // w: ancho en px · s: segundos que tardan en cruzar · mira: hacia dónde mira el dibujo · up: suben en vez de cruzar
  var CRIATURAS = [
    // tamaños aproximados a la realidad: la ballena no cabe entera en la ventana
    { img: 'animales/fish.png',          peso: 14, w: [95, 115],  s: [8, 11],   mira: 'izq' },
    { img: 'animales/tropical_fish.png', peso: 14, w: [95, 115],  s: [8, 11],   mira: 'izq' },
    { img: 'animales/blowfish.png',      peso: 10, w: [90, 105],  s: [10, 13],  mira: 'izq' },
    { img: 'animales/jellyfish.png',     peso: 9,  w: [115, 130], s: [13, 16],  up: true, pulse: true },
    { img: 'animales/octopus.png',       peso: 9,  w: [140, 155], s: [12, 15],  up: true, pulse: true },
    { img: 'animales/squid.png',         peso: 8,  w: [150, 165], s: [11, 14],  up: true, pulse: true },
    { img: 'animales/turtle.png',        peso: 9,  w: [175, 195], s: [14, 17],  mira: 'izq' },
    { img: 'animales/dolphin.png',       peso: 10, w: [230, 250], s: [7, 9],    mira: 'izq', fast: true, arc: 30 },
    { img: 'animales/shark.png',         peso: 10, w: [270, 295], s: [12, 15],  mira: 'izq', giro: 14 },
    { img: 'animales/whale.png',         peso: 7,  w: [470, 520], s: [22, 26],  mira: 'izq', giro: 6 }
  ];
  CRIATURAS.forEach(function (c) { c.id = c.svg || c.img.replace(/^.*\/|\.png$/g, ''); });
  var swimmers = ph.querySelector('.swimmers'), activos = 0, ultimo = '';
  function entre(r) { return r[0] + Math.random() * (r[1] - r[0]); }
  // elige uno al azar según su peso, sin repetir el último
  function elegir() {
    var total = 0, k;
    for (k = 0; k < CRIATURAS.length; k++) if (CRIATURAS[k].id !== ultimo) total += CRIATURAS[k].peso;
    var r = Math.random() * total;
    for (k = 0; k < CRIATURAS.length; k++) {
      if (CRIATURAS[k].id === ultimo) continue;
      if ((r -= CRIATURAS[k].peso) < 0) return CRIATURAS[k];
    }
    return CRIATURAS[0];
  }
  function soltar(forzado) {
    var c = forzado ? CRIATURAS.filter(function (x) { return x.id === forzado; })[0] : elegir(); ultimo = c.id; activos++;
    var w = entre(c.w), h = w;
    if (c.svg) { var vb = document.getElementById(c.svg).getAttribute('viewBox').split(' '); h = w * vb[3] / vb[2]; }
    var izq = !c.up && Math.random() < .5;            // ¿va hacia la izquierda?
    var girar = c.mira === 'izq' ? !izq : (c.mira === 'der' ? izq : false);
    var el = document.createElement('div');
    el.className = 'swimmer' + (girar ? ' left' : '') + (c.fast ? ' fast' : '') + (c.pulse ? ' pulse' : '');
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.innerHTML = '<div class="flip"><div class="body">' +
      (c.svg ? '<svg><use href="#' + c.svg + '"/></svg>' : '<img src="' + c.img + '" alt="">') + '</div></div>';
    swimmers.appendChild(el);

    var frames, dur = entre(c.s) * 1000;
    var x0, y0, x1, y1, ang;
    function lim(v, m) { return Math.max(-m, Math.min(m, v)); }
    if (c.up) {
      // pulpos, medusas y calamares suben desde abajo, rectos o en diagonal
      x0 = -w * .3 + Math.random() * (D - w * .4);
      x1 = -w * .3 + Math.random() * (D - w * .4);
      y0 = D + 10; y1 = -h - 10;
      ang = lim(Math.atan2(x1 - x0, y0 - y1) * 180 / Math.PI, 20);          // se inclinan hacia donde van
    } else {
      // el resto entra por la izquierda o la derecha, a cualquier altura y en diagonal
      x0 = izq ? D + 10 : -w - 10; x1 = izq ? -w - 10 : D + 10;
      y0 = -h * .4 + Math.random() * (D - h * .2);
      y1 = -h * .4 + Math.random() * (D - h * .2);
      var dx = x1 - x0, dy = y1 - y0;
      ang = lim((izq ? Math.atan2(-dy, -dx) : Math.atan2(dy, dx)) * 180 / Math.PI, c.giro || 22);   // el morro apunta hacia donde va
    }
    frames = [{ transform: 'translate(' + x0 + 'px,' + y0 + 'px) rotate(' + ang + 'deg)' },
              { transform: 'translate(' + (x0 + x1) / 2 + 'px,' + ((y0 + y1) / 2 - (c.arc || 0)) + 'px) rotate(' + ang + 'deg)' },
              { transform: 'translate(' + x1 + 'px,' + y1 + 'px) rotate(' + ang + 'deg)' }];
    var anim = el.animate(frames, { duration: dur, easing: 'linear' });

    // burbujitas mientras nada
    var burb = setInterval(function () {
      var m = new DOMMatrix(getComputedStyle(el).transform);
      var b = document.createElement('div');
      b.className = 'trail';
      b.style.setProperty('--s', (4 + Math.random() * 6) + 'px');
      b.style.left = (m.e + (c.up ? w / 2 : (izq ? w * .9 : w * .1))) + 'px';
      b.style.top = (m.f + (c.up ? h * .9 : h * .4)) + 'px';
      swimmers.appendChild(b);
      b.animate([{ transform: 'translate(0,0) scale(.6)', opacity: 1 }, { transform: 'translate(' + ((Math.random() - .5) * 20) + 'px,-60px) scale(1)', opacity: 0 }],
                { duration: 1600, easing: 'ease-out', fill: 'forwards' }).onfinish = function () { b.remove(); };
    }, 450 + Math.random() * 300);

    anim.onfinish = function () { clearInterval(burb); el.remove(); activos--; };
  }
  function programar(espera) {
    setTimeout(function () {
      if (activos < 2) soltar();
      programar(5000 + Math.random() * 5000);      // el siguiente, entre 5 y 10 s después
    }, espera);
  }
  programar(800);
  window.soltarCriatura = soltar;   // para probar: soltarCriatura('shark')
  html = '';
  for (i = 0; i < 12; i++) {
    html += '<span style="--x:' + (10 + rnd() * 80).toFixed(0) + '%;--s:' + (5 + rnd() * 12 | 0) + 'px"></span>';
  }
  ph.querySelector('.pbub').innerHTML = html;
  ph.querySelectorAll('.pbub span').forEach(function (el) {
    var d = (6 + rnd() * 4) * 1000, w = (rnd() - .5) * 30;
    el.animate([{ transform: 'translate(0,0)', opacity: 0 }, { opacity: 1, offset: .1 }, { transform: 'translate(' + w + 'px,-340px)', opacity: 0 }],
               { duration: d, delay: -rnd() * d, iterations: Infinity, easing: 'ease-in' });
  });
  html = '';
  for (i = 0; i < 5; i++) {
    html += '<span style="--x:' + (rnd() * 100).toFixed(0) + '%;--y:' + (rnd() * 100).toFixed(0) + '%;--s:' + (50 + rnd() * 70 | 0) + 'px;--c:' + tints[i % tints.length] + '"></span>';
  }
  ph.querySelector('.pbokeh').innerHTML = html;
  luces(ph.querySelector('.pbokeh'), 60, 8, 8);

  // ----- perlitas -----
  var sea = document.querySelector('.sea');
  [[640, 70, 12], [1280, 64, 14], [560, 100, 9], [1360, 104, 10], [1896, 40, 12], [16, 80, 10], [1488, 694, 11], [10, 520, 9], [1904, 420, 10]].forEach(function (p, k) {
    var s = document.createElement('div');
    s.className = 'pearl';
    s.style.left = p[0] + 'px';
    s.style.top = p[1] + 'px';
    s.style.setProperty('--s', p[2] + 'px');
    s.style.setProperty('--t', (k * .41).toFixed(2) + 's');
    s.style.setProperty('--d', (2.6 + (k % 3) * .7) + 's');
    sea.appendChild(s);
  });
})();
</script>
</body>
</html>
