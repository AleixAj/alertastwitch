<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlay Luxanita</title>
<!--
  OVERLAY SUBMARINO PARA OBS (1920x1080) — inspirado en Nami (olas, escamas, burbujas)
  - En OBS: fuente "Navegador", archivo local = este overlay.html, 1920 x 1080.
  - Los huecos del juego y de la cámara son transparentes.
  - Para verlo con contenido de ejemplo, abre: overlay.html?demo
  - Posiciones y tamaños de los huecos: en LAYOUT (más abajo) y en INSTRUCCIONES.txt
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');

:root {
  --pink: #ff5fa8;
  --pink-soft: #ffc2dd;
  --pink-deep: #e2317f;
  --coral: #ff7f9e;
  --aqua: #7ff3e6;          /* toque de Nami */
  --pearl: #fff6fb;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

/* escenario fijo de 1920x1080 que se escala a la ventana */
#stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  font-family: 'Fredoka', 'Nunito', 'Segoe UI Rounded', 'Arial Rounded MT Bold', 'Segoe UI', system-ui, sans-serif;
}

/* ===== Fondo marino (todo menos los huecos; la forma la pone el JS) ===== */
.sea {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse 45% 22% at 50% 0%, rgba(255,214,236,.75), rgba(255,160,205,0) 75%),
    radial-gradient(ellipse 35% 45% at 0% 100%, rgba(255,95,168,.35), transparent 70%),
    radial-gradient(ellipse 35% 45% at 100% 100%, rgba(200,120,255,.3), transparent 70%),
    linear-gradient(180deg, #e97bbd 0%, #b2479b 25%, #85308f 55%, #62237a 85%, #56206f 100%);
}

/* rayos de luz desde la superficie */
.rays {
  position: absolute;
  inset: -10% -10% 0;
  background: repeating-linear-gradient(100deg,
    rgba(255,230,245,0) 0 70px, rgba(255,230,245,.16) 90px, rgba(255,230,245,0) 140px,
    rgba(255,230,245,0) 230px, rgba(255,230,245,.1) 250px, rgba(255,230,245,0) 300px);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.5) 45%, transparent 85%);
          mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.5) 45%, transparent 85%);
  animation: rays 14s ease-in-out infinite alternate;
}
@keyframes rays {
  from { transform: translateX(-60px) skewX(-4deg); opacity: .8; }
  to   { transform: translateX(60px) skewX(4deg); opacity: 1; }
}

/* reflejos de agua (cáusticas) que se mueven arriba */
.caustics {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 260px;
  background:
    radial-gradient(ellipse 60px 18px at 10% 30%, rgba(255,255,255,.18), transparent 70%),
    radial-gradient(ellipse 80px 22px at 28% 55%, rgba(255,255,255,.14), transparent 70%),
    radial-gradient(ellipse 70px 20px at 47% 20%, rgba(255,255,255,.16), transparent 70%),
    radial-gradient(ellipse 90px 24px at 68% 45%, rgba(255,255,255,.14), transparent 70%),
    radial-gradient(ellipse 60px 18px at 86% 25%, rgba(255,255,255,.18), transparent 70%);
  background-size: 960px 260px;
  animation: caustics 10s linear infinite;
  opacity: .9;
}
@keyframes caustics { to { background-position: 960px 0; } }

/* puntitos de plancton */
.sea::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.08) 1.4px, transparent 1.6px);
  background-size: 30px 30px;
}

/* burbujas */
.bubbles span {
  position: absolute;
  bottom: -60px;
  left: var(--x);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.14) 12%, rgba(255,214,236,.1) 60%, rgba(255,214,236,.55) 100%);
  box-shadow: inset 0 0 6px rgba(255,255,255,.55), 0 0 8px rgba(255,194,221,.25);
  animation: rise var(--d) linear var(--t) infinite;
}
.bubbles span i {
  display: block;
  width: 100%;
  height: 100%;
}
@keyframes rise {
  0%   { transform: translate(0, 0); opacity: 0; }
  6%   { opacity: 1; }
  25%  { transform: translate(var(--w), -280px); }
  50%  { transform: translate(calc(var(--w) * -1), -560px); }
  75%  { transform: translate(var(--w), -840px); }
  100% { transform: translate(0, -1160px); opacity: .2; }
}

/* peces pequeños que cruzan */
.fish {
  position: absolute;
  left: 0;
  top: var(--y);
  width: 46px;
  height: 22px;
  color: rgba(255,214,236,.55);
  animation: swim var(--d) linear var(--t) infinite;
}
.fish svg { display: block; width: 100%; height: 100%; animation: wiggle .6s ease-in-out infinite alternate; }
.fish.back { animation-name: swim-back; }
.fish.back svg { transform: scaleX(-1); animation-name: wiggle-back; }
@keyframes swim      { from { transform: translateX(-80px); }  to { transform: translateX(2000px); } }
@keyframes swim-back { from { transform: translateX(2000px); } to { transform: translateX(-80px); } }
@keyframes wiggle      { from { transform: skewY(-4deg); } to { transform: skewY(4deg); } }
@keyframes wiggle-back { from { transform: scaleX(-1) skewY(-4deg); } to { transform: scaleX(-1) skewY(4deg); } }

/* luces difuminadas que flotan (bokeh) */
.bokeh span {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  border-radius: 50%;
  background: radial-gradient(circle, var(--c) 0%, rgba(255,255,255,0) 70%);
  mix-blend-mode: screen;
  filter: blur(2px);
  animation: drift var(--d) ease-in-out var(--t) infinite alternate, breathe calc(var(--d) / 2.5) ease-in-out var(--t) infinite alternate;
}
@keyframes drift   { from { transform: translate(0, 0); } to { transform: translate(var(--dx), var(--dy)); } }
@keyframes breathe { from { opacity: .45; } to { opacity: 1; } }

/* ===== Marcos color perla ===== */
.frame {
  position: absolute;
  box-sizing: border-box;
  border: 7px solid var(--pearl);
  border-radius: 35px;
  box-shadow:
    0 0 0 3px rgba(255,95,168,.55),
    0 8px 0 3px rgba(226,49,127,.45),
    0 18px 44px rgba(60,10,70,.5);
}
/* brillo perlado que recorre el marco */
.frame .edge {
  position: absolute;
  inset: -10px;
  border-radius: 42px;
  padding: 4px;
  overflow: hidden;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}
.frame .edge::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2400px;
  height: 2400px;
  margin: -1200px 0 0 -1200px;
  background: conic-gradient(from 0deg, rgba(127,243,230,0) 0deg, rgba(127,243,230,0) 290deg, var(--aqua) 325deg, #fff 345deg, rgba(255,95,168,0) 360deg);
  animation: spin var(--spin, 9s) linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ola que se riza sobre el marco del juego */
.wave {
  position: absolute;
  left: 40px;
  top: -44px;                /* asentada sobre el borde, sin entrar en el hueco */
  width: 300px;
  height: 40px;
  filter: drop-shadow(0 3px 0 rgba(226,49,127,.45));
}
.wave.r { left: auto; right: 40px; transform: scaleX(-1); }
.wave svg { display: block; width: 100%; height: 100%; overflow: visible; }
.wave .foam { animation: foam 3s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes foam { from { transform: translateY(1px) scaleY(.94); } to { transform: translateY(-1px) scaleY(1.04); } }

/* etiqueta del marco */
.tag {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 22px 7px;
  border-radius: 999px;
  background: linear-gradient(180deg, #ff86c0 0%, var(--pink) 55%, #f24c98 100%);
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .04em;
  white-space: nowrap;
  text-shadow: 0 2px 0 rgba(180,20,90,.35);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 4px 0 var(--pink-deep), 0 0 18px rgba(255,95,168,.45);
  z-index: 2;
}
.tag svg { width: .9em; height: .9em; vertical-align: -.1em; margin-right: 6px; }


/* ===== Título ===== */
.title {
  position: absolute;
  left: 50%;
  top: 20px;
  transform: translateX(-50%);
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-5px); }
}
.title-card {
  position: relative;
  padding: 4px 60px 10px;
  border-radius: 999px;
  background:
    radial-gradient(circle at 50% 120%, rgba(127,243,230,.25), transparent 60%),
    linear-gradient(180deg, #fff 0%, #fff0f7 55%, #ffd6ea 100%);
  border: 5px solid var(--pearl);
  box-shadow:
    0 0 0 3px rgba(255,95,168,.55),
    0 8px 0 3px rgba(226,49,127,.45),
    0 16px 36px rgba(60,10,70,.55),
    inset 0 0 22px rgba(255,194,221,.8);
  overflow: hidden;
}
/* escamas de sirena muy suaves */
.title-card .scales {
  position: absolute;
  inset: 0;
  opacity: .35;
  background:
    radial-gradient(circle at 50% 0, transparent 13px, rgba(255,140,196,.55) 14px, transparent 16px) 0 0 / 30px 18px,
    radial-gradient(circle at 50% 0, transparent 13px, rgba(255,140,196,.55) 14px, transparent 16px) 15px 9px / 30px 18px;
}
.title-card .shine {
  position: absolute;
  top: -30%;
  bottom: -30%;
  left: 0;
  width: 100%;
  background: linear-gradient(90deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 60%);
  transform: translateX(-120%) skewX(-20deg);
  animation: shine 7s ease-in-out 2s infinite;
}
@keyframes shine {
  0%        { transform: translateX(-120%) skewX(-20deg); }
  14%, 100% { transform: translateX(120%) skewX(-20deg); }
}
.name {
  position: relative;
  font-size: 64px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: .01em;
  background: linear-gradient(180deg, #ff8cc4 0%, #ff4f9f 45%, #d42475 100%);
  -webkit-background-clip: text;
          background-clip: text;
  color: transparent;
  filter:
    drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
    drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
    drop-shadow(0 5px 0 var(--pink-soft));
}
/* olas rizadas a los lados del título */
.title .curl {
  position: absolute;
  top: 50%;
  width: 70px;
  height: 52px;
  margin-top: -26px;
  filter: drop-shadow(0 0 8px rgba(127,243,230,.55));
  animation: curl 3s ease-in-out infinite alternate;
}
.title .curl.l { left: -84px; }
.title .curl.r { right: -84px; transform: scaleX(-1); animation-name: curl-r; }
@keyframes curl   { from { transform: rotate(-4deg); } to { transform: rotate(4deg) translateY(-3px); } }
@keyframes curl-r { from { transform: scaleX(-1) rotate(-4deg); } to { transform: scaleX(-1) rotate(4deg) translateY(-3px); } }
.title svg { display: block; width: 100%; height: 100%; }

/* perlitas */
.pearl {
  position: absolute;
  width: var(--s, 12px);
  height: var(--s, 12px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 20%, #ffe3f1 45%, #f5b3d4 100%);
  box-shadow: 0 0 8px rgba(255,255,255,.6);
  animation: glint var(--d, 3s) ease-in-out var(--t, 0s) infinite;
}
@keyframes glint {
  0%, 100% { opacity: .55; transform: scale(.85); }
  50%      { opacity: 1;   transform: scale(1.1); }
}

/* ===== Ojo de buey: ventanita redonda con una escena submarina ===== */
.porthole {
  position: absolute;
  left: 1546px;              /* centro en x=1696, y=304 (lo recoloca el JS según la cámara) */
  top: 154px;
  width: 300px;
  height: 300px;
  animation: hover 5s ease-in-out infinite;
}
@keyframes hover {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
/* aro perlado */
.porthole .ring {
  position: absolute;
  inset: -18px;
  border-radius: 50%;
  background: conic-gradient(from 200deg, #fff, #ffd3e8, #ff9ccb, #fff, #c8fff8, #ffd3e8, #fff);
  box-shadow:
    0 0 0 3px rgba(255,95,168,.6),
    0 8px 0 3px rgba(226,49,127,.45),
    0 18px 40px rgba(60,10,70,.5),
    inset 0 0 0 3px rgba(255,255,255,.7),
    inset 0 0 14px rgba(226,49,127,.45);
}
/* remaches de perla en el aro */
.porthole .rivet {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 22%, #ffe3f1 50%, #f29cc7 100%);
  box-shadow: 0 1px 2px rgba(120,20,80,.45);
}
/* el agua de dentro */
.porthole .water {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  background:
    radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,220,240,.65), transparent 70%),
    linear-gradient(180deg, #f08cc6 0%, #c552a8 40%, #8a2f92 75%, #5a1f73 100%);
  box-shadow: inset 0 0 30px rgba(40,5,50,.55);
}
.porthole .water .rays {
  inset: -20% -30% 0;
  animation-duration: 9s;
}
/* medusa */
.porthole .jelly {
  position: absolute;
  left: 34%;
  top: 14%;
  width: 34%;
  height: 48%;
  animation: jelly-move 9s ease-in-out infinite;
}
.porthole .jelly svg { display: block; width: 100%; height: 100%; overflow: visible; }
.porthole .jelly .bell { animation: pulse 1.8s ease-in-out infinite; transform-origin: 35px 30px; }
.porthole .jelly .tent { animation: tent 1.8s ease-in-out infinite; transform-origin: 35px 34px; }
@keyframes jelly-move {
  0%, 100% { transform: translate(0, 10px) rotate(-6deg); }
  50%      { transform: translate(26px, -22px) rotate(6deg); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1, 1); }
  45%      { transform: scale(.9, 1.08); }
}
@keyframes tent {
  0%, 100% { transform: scaleY(1) skewX(0deg); }
  45%      { transform: scaleY(.86) skewX(6deg); }
}
/* peces dentro */
.porthole .pfish {
  position: absolute;
  left: 0;
  top: var(--y);
  width: var(--w, 40px);
  height: calc(var(--w, 40px) * .48);
  color: var(--c, #ffe3f1);
  animation: pswim var(--d) linear var(--t) infinite;
}
.porthole .pfish svg { display: block; width: 100%; height: 100%; animation: wiggle .5s ease-in-out infinite alternate; }
.porthole .pfish.back { animation-name: pswim-back; }
.porthole .pfish.back svg { animation-name: wiggle-back; }
@keyframes pswim      { from { transform: translateX(-60px); } to { transform: translateX(360px); } }
@keyframes pswim-back { from { transform: translateX(360px); } to { transform: translateX(-60px); } }
.porthole .pbub span {
  position: absolute;
  bottom: -20px;
  left: var(--x);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,.15) 14%, rgba(255,214,236,.55) 100%);
  animation: prise var(--d) ease-in var(--t) infinite;
}
@keyframes prise {
  0%   { transform: translate(0, 0); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: translate(var(--w, 10px), -340px); opacity: 0; }
}
/* brillo del cristal */
.porthole .glass {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(ellipse 34% 20% at 32% 22%, rgba(255,255,255,.55), transparent 70%),
    radial-gradient(circle at 50% 50%, transparent 62%, rgba(255,255,255,.18) 70%, transparent 74%);
  pointer-events: none;
}

/* ===== Modo demo (overlay.html?demo): contenido de ejemplo en los huecos ===== */
.demo { position: absolute; overflow: hidden; border-radius: 28px; }
.demo.game {
  background:
    radial-gradient(ellipse 30% 20% at 70% 30%, rgba(255,255,200,.6), transparent 70%),
    linear-gradient(180deg, #7ec8ff 0%, #b9e3ff 45%, #6fcf6a 46%, #3f9a45 100%);
}
.demo.game::after, .demo.cam::after {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 700 64px/1 'Fredoka', sans-serif;
  color: rgba(255,255,255,.75);
  letter-spacing: .2em;
}
.demo.game::after { content: 'JUEGO'; }
.demo.cam { background: linear-gradient(135deg, #5b3a6e, #2e2240); }
.demo.cam::after { content: 'CÁMARA'; font-size: 34px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<div id="stage">
  <div class="sea">
    <div class="rays"></div>
    <div class="caustics"></div>
    <div class="fishes"></div>
    <div class="bokeh"></div>
    <div class="bubbles"></div>
  </div>
  <div id="demo-layer"></div>
  <div id="deco" style="position:absolute;inset:0">
  <div id="frames"></div>
  <div class="porthole">
    <div class="ring"></div>
    <div class="water">
      <div class="rays"></div>
      <div class="bokeh pbokeh"></div>
      <div class="pfishes"></div>
      <div class="jelly"><svg viewBox="0 0 70 100" aria-hidden="true">
        <g class="tent" stroke-linecap="round" fill="none">
          <path d="M18 34 C8 46 28 58 16 70 C10 76 20 80 16 86" stroke="#ffd3e8" stroke-width="4.5" opacity=".75"/>
          <path d="M28 36 C18 50 38 62 26 76 C20 84 32 88 27 96" stroke="#fff" stroke-width="5" opacity=".8"/>
          <path d="M42 36 C52 50 32 62 44 76 C50 84 38 88 43 96" stroke="#fff" stroke-width="5" opacity=".8"/>
          <path d="M52 34 C62 46 42 58 54 70 C60 76 50 80 54 86" stroke="#ffd3e8" stroke-width="4.5" opacity=".75"/>
          <path d="M35 36 C27 48 43 56 35 70" stroke="#ff9ccb" stroke-width="8" opacity=".75"/>
        </g>
        <g class="bell">
          <path d="M4 34 C4 14 18 2 35 2 C52 2 66 14 66 34 C60 30 56 37 50 33 C45 37 40 31 35 35 C30 31 25 37 20 33 C14 37 10 30 4 34Z" fill="#ff8cc4" opacity=".92"/>
          <path d="M12 26 C14 14 23 8 34 8" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/>
          <circle cx="24" cy="20" r="3" fill="#fff" opacity=".7"/><circle cx="44" cy="16" r="2.2" fill="#fff" opacity=".6"/>
        </g>
      </svg></div>
      <div class="pbub"></div>
    </div>
    <div class="glass"></div>
  </div>
  <div class="title">
    <div class="title-card">
      <div class="scales"></div>
      <div class="shine"></div>
      <div class="name">Luxanita</div>

    <div class="curl l"><svg><use href="#curl"/></svg></div>
    <div class="curl r"><svg><use href="#curl"/></svg></div>
  </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="wave-g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#d9fffa"/><stop offset="1" stop-color="#7ff3e6"/>
  </linearGradient>
  <!-- ola rizada (espiral de agua) -->
  <symbol id="curl" viewBox="0 0 70 52">
    <path d="M4 50 C4 26 18 6 40 6 C56 6 66 16 66 28 C66 38 58 44 50 44 C42 44 38 38 38 32 C38 27 42 24 46 24 C50 24 52 27 51 30 C49 26 43 27 43 32 C43 37 47 40 52 39 C58 38 61 33 60 27 C59 18 51 12 40 12 C24 12 13 28 14 50Z" fill="url(#wave-g)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="fish" viewBox="0 0 46 22">
    <path d="M2 11 C10 2 26 1 34 11 C26 21 10 20 2 11Z M34 11 L45 3 L42 11 L45 19Z" fill="currentColor"/>
    <circle cx="10" cy="9.5" r="1.6" fill="#4c1c6b"/>
  </symbol>
  <symbol id="bubble-ico" viewBox="0 0 16 16">
    <circle cx="6" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12.5" cy="4" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </symbol>
</defs></svg>

<script>
(function () {
  // ===== Huecos (en píxeles de una pantalla 1920x1080) =====
  // Si los cambias, cambia también las posiciones en OBS (INSTRUCCIONES.txt).
  var LAYOUT = {
    game: { x: 32,   y: 122, w: 1440, h: 810 },   // 16:9
    cam:  { x: 1504, y: 492, w: 384,  h: 440 }    // casi cuadrada, un poco más alta que ancha
  };
  var R = 28;          // redondeo de las esquinas de los huecos
  var BORDER = 7;      // grosor del marco

  var stage = document.getElementById('stage');
  var frames = document.getElementById('frames');
  var demo = /[?&]demo\b/.test(location.search);

  // escala el escenario de 1920x1080 a la ventana (por si la fuente de OBS tiene otro tamaño)
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  // números aleatorios repetibles (siempre sale igual)
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry(11);

  // ----- fondo con agujeros: rectángulo completo + un rectángulo redondeado por hueco -----
  function rr(b) {
    var x = b.x, y = b.y, w = b.w, h = b.h, r = R;
    return 'M' + (x + r) + ' ' + y + 'H' + (x + w - r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + w) + ' ' + (y + r) +
           'V' + (y + h - r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + w - r) + ' ' + (y + h) +
           'H' + (x + r) + 'A' + r + ' ' + r + ' 0 0 1 ' + x + ' ' + (y + h - r) +
           'V' + (y + r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + r) + ' ' + y + 'Z';
  }
  var path = 'M0 0H1920V1080H0Z' + rr(LAYOUT.game) + rr(LAYOUT.cam);
  // el fondo y toda la decoración se recortan con la misma forma: nada pinta dentro de los huecos
  document.querySelector('.sea').style.clipPath = "path(evenodd, '" + path + "')";
  document.getElementById('deco').style.clipPath = "path(evenodd, '" + path + "')";

  // ----- ola que se riza (para encima del marco del juego) -----
  var WAVE = '<svg viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true"><g class="foam">' +
    '<path d="M0 40 C30 40 40 26 62 22 C80 19 92 28 88 34 C85 38 78 36 79 31 C70 33 72 40 84 40Z" fill="url(#wave-g)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="M70 40 C110 38 120 12 152 8 C178 5 196 20 190 31 C186 38 174 36 176 28 C162 30 164 40 180 40Z" fill="url(#wave-g)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="M170 40 C200 40 212 24 234 20 C252 17 264 27 260 33 C257 38 250 36 251 31 C242 33 244 40 256 40 L300 40Z" fill="url(#wave-g)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="120" cy="6" r="3" fill="#fff"/><circle cx="210" cy="12" r="2.4" fill="#fff"/><circle cx="40" cy="16" r="2" fill="#fff"/>' +
    '</g></svg>';

  // ----- marcos -----
  function place(el, b, grow) {
    el.style.left = (b.x - grow) + 'px';
    el.style.top = (b.y - grow) + 'px';
    el.style.width = (b.w + grow * 2) + 'px';
    el.style.height = (b.h + grow * 2) + 'px';
  }
  function frame(key, b, opts) {
    if (demo) {
      var d = document.createElement('div');
      d.className = 'demo ' + key;
      place(d, b, 0);
      document.getElementById('demo-layer').appendChild(d);
    }
    var f = document.createElement('div');
    f.className = 'frame';
    place(f, b, BORDER);
    f.style.setProperty('--spin', opts.spin);
    f.innerHTML = '<div class="edge"></div>' +
      (opts.waves ? '<div class="wave">' + WAVE + '</div><div class="wave r">' + WAVE + '</div>' : '') +
      (opts.tag ? '<div class="tag">' + opts.tag + '</div>' : '');
    frames.appendChild(f);
  }

  frame('game', LAYOUT.game, { waves: true, spin: '14s' });
  frame('cam',  LAYOUT.cam,  { spin: '9s' });

  // ----- luces difuminadas (rosas, blancas y algún toque aguamarina) -----
  var bokeh = document.querySelector('.bokeh'), html = '';
  var tints = ['rgba(255,190,225,.75)', 'rgba(255,255,255,.6)', 'rgba(255,130,200,.7)', 'rgba(127,243,230,.5)', 'rgba(225,180,255,.65)'];
  for (var i = 0; i < 34; i++) {
    html += '<span style="--x:' + (rnd() * 100).toFixed(1) + '%;--y:' + (rnd() * 100).toFixed(1) + '%;--s:' + (60 + rnd() * 160 | 0) + 'px;--c:' + tints[i % tints.length] +
            ';--d:' + (10 + rnd() * 12).toFixed(1) + 's;--t:' + (-rnd() * 20).toFixed(1) + 's;--dx:' + ((rnd() - .5) * 160 | 0) + 'px;--dy:' + ((rnd() - .5) * 120 | 0) + 'px"></span>';
  }
  bokeh.innerHTML = html;

  // ----- burbujas -----
  var bubbles = document.querySelector('.bubbles'); html = '';
  for (i = 0; i < 90; i++) {
    html += '<span style="--x:' + (rnd() * 100).toFixed(1) + '%;--s:' + (6 + Math.pow(rnd(), 2) * 44 | 0) + 'px;--d:' + (9 + rnd() * 9).toFixed(1) + 's;--t:' + (-rnd() * 18).toFixed(1) + 's;--w:' + (6 + rnd() * 18 | 0) + 'px"></span>';
  }
  bubbles.innerHTML = html;

  // ----- peces (cruzan por arriba y por abajo, donde no hay huecos) -----
  var fishes = document.querySelector('.fishes'); html = '';
  [[40, 26, 0, false], [78, 34, -14, true], [968, 30, -6, true], [1010, 40, -22, false], [1040, 28, -9, false]].forEach(function (f) {
    html += '<div class="fish' + (f[3] ? ' back' : '') + '" style="--y:' + f[0] + 'px;--d:' + f[1] + 's;--t:' + f[2] + 's"><svg><use href="#fish"/></svg></div>';
  });
  fishes.innerHTML = html;

  // ----- ojo de buey: centrado en el hueco que queda encima de la cámara -----
  var ph = document.querySelector('.porthole');
  var top = 122, bottom = LAYOUT.cam.y - BORDER - 10;       // espacio libre encima de la cámara
  var D = Math.min(300, bottom - top - 50, LAYOUT.cam.w - 60);
  ph.style.width = ph.style.height = D + 'px';
  ph.style.left = (LAYOUT.cam.x + LAYOUT.cam.w / 2 - D / 2) + 'px';
  ph.style.top = (top + (bottom - top) / 2 - D / 2) + 'px';
  var ring = ph.querySelector('.ring');
  for (i = 0; i < 12; i++) {
    var a = i / 12 * Math.PI * 2, rv = document.createElement('div');
    rv.className = 'rivet';
    rv.style.left = (D / 2 + 18 + Math.cos(a) * (D / 2 + 9)) + 'px';
    rv.style.top = (D / 2 + 18 + Math.sin(a) * (D / 2 + 9)) + 'px';
    ring.appendChild(rv);
  }
  html = '';
  [[60, 14, 0, false, 34, '#ffe3f1'], [150, 18, -7, true, 26, '#7ff3e6'], [200, 11, -3, false, 22, '#ffd56b']].forEach(function (f) {
    html += '<div class="pfish' + (f[3] ? ' back' : '') + '" style="--y:' + f[0] + 'px;--d:' + f[1] + 's;--t:' + f[2] + 's;--w:' + f[4] + 'px;--c:' + f[5] + '"><svg><use href="#fish"/></svg></div>';
  });
  ph.querySelector('.pfishes').innerHTML = html;
  html = '';
  for (i = 0; i < 14; i++) {
    html += '<span style="--x:' + (10 + rnd() * 80).toFixed(0) + '%;--s:' + (5 + rnd() * 12 | 0) + 'px;--d:' + (3.5 + rnd() * 3).toFixed(1) + 's;--t:' + (-rnd() * 6).toFixed(1) + 's;--w:' + ((rnd() - .5) * 30 | 0) + 'px"></span>';
  }
  ph.querySelector('.pbub').innerHTML = html;
  html = '';
  for (i = 0; i < 7; i++) {
    html += '<span style="--x:' + (rnd() * 100).toFixed(0) + '%;--y:' + (rnd() * 100).toFixed(0) + '%;--s:' + (50 + rnd() * 70 | 0) + 'px;--c:' + tints[i % tints.length] +
            ';--d:' + (8 + rnd() * 8).toFixed(1) + 's;--t:' + (-rnd() * 10).toFixed(1) + 's;--dx:' + ((rnd() - .5) * 60 | 0) + 'px;--dy:' + ((rnd() - .5) * 60 | 0) + 'px"></span>';
  }
  ph.querySelector('.pbokeh').innerHTML = html;

  // ----- perlitas -----
  var sea = document.querySelector('.sea');
  [[640, 70, 12], [1280, 64, 14], [560, 100, 9], [1360, 104, 10], [1896, 40, 12], [16, 80, 10], [1488, 694, 11], [10, 520, 9], [1904, 420, 10]].forEach(function (p, k) {
    var s = document.createElement('div');
    s.className = 'pearl';
    s.style.left = p[0] + 'px';
    s.style.top = p[1] + 'px';
    s.style.setProperty('--s', p[2] + 'px');
    s.style.setProperty('--t', (k * .41).toFixed(2) + 's');
    s.style.setProperty('--d', (2.6 + (k % 3) * .7) + 's');
    sea.appendChild(s);
  });
})();
</script>
</body>
</html>
