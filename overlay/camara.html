<!--
  MARCO DE CÁMARA SUELTO: solo el marco con sus destellos y el nombre, con fondo transparente.
  - En OBS: fuente "Navegador", archivo local = este archivo, ancho 448 y alto 372.
  - Pon la cámara debajo, en la posición 48, 40 respecto a esta fuente y con tamaño 352 x 264,
    agrúpalas y muévelas juntas a donde quieras.
  - Para hacerlo más grande sin que se vea borroso, no lo estires en OBS: multiplica ancho y alto
    de la fuente por lo mismo (p. ej. 672 x 558 = x1,5) y la cámara igual (528 x 396 en 72, 60).
-->
</head>
<body>
<script src="comun.js"></script>
<script>
  montarEscena({
    lienzo: { w: 448, h: 372 },                 // el marco con margen para su brillo y su sombra
    fondo: false,
    huecos: [
      { tipo: 'cam', x: 48, y: 40, w: 352, h: 264, nombre: 'Luxanita' }
    ],
    titulo: false
  });
</script>
</body>
