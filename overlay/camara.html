<!--
  MARCO DE CÁMARA SUELTO: solo el marco con sus destellos y el nombre, con fondo transparente.
  - En OBS: fuente "Navegador", archivo local = este archivo, ancho 568 y alto 462 (el marco es igual que el de la cámara de la escena de juego).
  - Pon la cámara debajo, en la posición 48, 40 respecto a esta fuente y con tamaño 472 x 354,
    agrúpalas y muévelas juntas a donde quieras.
  - Para hacerlo más grande sin que se vea borroso, no lo estires en OBS: multiplica ancho y alto
    de la fuente por lo mismo (p. ej. 852 x 693 = x1,5) y la cámara igual (708 x 531 en 72, 60).
-->
</head>
<body>
<script src="comun.js"></script>
<script>
  montarEscena({
    lienzo: { w: 568, h: 462 },                 // el marco con margen para su brillo y su sombra
    fondo: false,
    huecos: [
      { tipo: 'cam', x: 48, y: 40, w: 472, h: 354, nombre: 'Luxanita' }
    ],
    titulo: false
  });
</script>
</body>
