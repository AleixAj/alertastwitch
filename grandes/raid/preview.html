<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba alerta raid</title>
<link rel="stylesheet" href="alerta.css">
<style>
  body {
    min-height: 100vh;
    background: #1b1530 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="%231b1530"/><rect width="40" height="40" fill="%23221a3b"/><rect x="40" y="40" width="40" height="40" fill="%23221a3b"/></svg>') !important;
    font-family: system-ui, sans-serif;
  }
  .controls {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    display: flex; gap: 8px; align-items: center;
    background: rgba(0,0,0,.55); padding: 10px; border-radius: 12px; color: #fff;
  }
  .controls input { padding: 8px 10px; border-radius: 8px; border: 0; font-size: 15px; width: 220px; }
  .controls button { padding: 8px 14px; border-radius: 8px; border: 0; background: #ff5fa8; color: #fff; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="controls">
  <input id="n" value="Luxanita" maxlength="25">
  <label style="font-size:13px">Personas <input id="m" type="number" min="1" max="10000" value="25" style="width:56px;padding:6px;border-radius:8px;border:0"></label>
  <button id="go">Probar alerta</button>
  <label style="display:flex;align-items:center;gap:6px;font-size:13px">🔈 <input id="vol" type="range" min="0" max="100" value="100" style="width:110px;accent-color:#ff5fa8"> <span id="volv">100%</span></label>
  <span id="snd" style="font-size:13px;opacity:.85"></span>
</div>

  <div class="card-wrap">
    <div class="card-pop">
    <div class="card">
      <div class="glow"></div>
      <div class="card-bg"></div>
      <div class="band-line"></div>
      <div class="close-spark"></div>
      <span class="spark star4" style="left:30px;top:-10px;--t:0s"></span>
      <span class="spark star4" style="right:40px;bottom:-8px;--t:.6s;width:16px;height:16px"></span>

      <div class="tag">RAID</div>
      <div class="name" id="sub-name">{name}</div>
      <span id="raid-amount" hidden>{amount}</span>
      <div class="thanks" id="raid-text">¡ha llegado con su raid!</div>
    </div>
    </div>
  </div>
</div>
</template>
<script>
  var tpl = document.getElementById('tpl').innerHTML;
  function play(withSound) {
    var name = document.getElementById('n').value || 'Anónimo';
    var safe = name.replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
    document.getElementById('stage').innerHTML = tpl.replace('{name}', safe).replace('{amount}', document.getElementById('m').value || '1');
    // sonido (en Streamlabs se sube aparte, en el apartado Sound). Solo al pulsar el botón.
    if (withSound !== false) {
      if (!window.sfx) window.sfx = new Audio('sonido.mp3');
      sfx.volume = document.getElementById('vol').value / 100;
      sfx.currentTime = 0;
      var snd = document.getElementById('snd');
      sfx.play().then(function () { snd.textContent = '🔊 sonando'; })
        .catch(function (e) { snd.textContent = e.name === 'NotAllowedError' ? '🔇 pulsa Probar alerta para oírlo' : '🔇 no se pudo cargar el sonido'; });
    }
    var old = document.getElementById('alerta-js'); if (old) old.remove();
    var s = document.createElement('script');
    s.id = 'alerta-js';
    s.src = 'alerta.js?' + Date.now();
    document.body.appendChild(s);
  }
  document.getElementById('go').onclick = play;
  // volumen (se recuerda en este navegador)
  var vol = document.getElementById('vol');
  try { var saved = localStorage.getItem('alerta-vol2'); if (saved !== null) vol.value = saved; } catch (e) {}
  function showVol() {
    document.getElementById('volv').textContent = vol.value + '%';
    if (window.sfx) sfx.volume = vol.value / 100;
    try { localStorage.setItem('alerta-vol2', vol.value); } catch (e) {}
  }
  vol.oninput = showVol;
  showVol();
  play(false);   // al abrir: solo la animación, sin sonido
</script>
</body>
</html>
